<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CostPulse</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>body{font-family:'Cairo',system-ui,sans-serif;background:#f8fafc;color:#1e293b}</style>
</head>
<body>
<!-- Auth -->
<div id="auth" class="min-h-screen flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 w-full max-w-sm space-y-3">
    <div class="flex items-center gap-3 mb-2"><div class="w-10 h-10 rounded-xl bg-indigo-600 text-white font-extrabold flex items-center justify-center">CP</div><h1 class="text-xl font-extrabold">CostPulse</h1></div>
    <input id="email" type="email" placeholder="البريد الإلكتروني" dir="ltr" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm">
    <input id="pass" type="password" placeholder="كلمة السر (6 أحرف على الأقل)" dir="ltr" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm">
    <button onclick="signIn()" class="w-full bg-indigo-600 text-white py-2.5 rounded-xl font-bold text-sm">دخول</button>
    <button onclick="signUp()" class="w-full bg-slate-100 text-slate-700 py-2.5 rounded-xl font-bold text-sm">إنشاء حساب جديد</button>
    <p id="authMsg" class="text-xs text-rose-600"></p>
  </div>
</div>

<!-- Setup -->
<div id="setup" class="hidden min-h-screen flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 w-full max-w-sm space-y-3">
    <h2 class="text-lg font-extrabold">إعداد الشركة</h2>
    <input id="cName" placeholder="اسم الشركة" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm">
    <input id="cCash" type="number" placeholder="الرصيد النقدي الافتتاحي (ج.م)" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm">
    <button onclick="createCompany()" class="w-full bg-indigo-600 text-white py-2.5 rounded-xl font-bold text-sm">إنشاء</button>
    <p id="setupMsg" class="text-xs text-rose-600"></p>
  </div>
</div>

<!-- Dashboard -->
<div id="app" class="hidden">
  <header class="bg-white border-b border-slate-200 px-4 md:px-8 py-4 flex flex-wrap justify-between items-center gap-3 sticky top-0 z-10">
    <div><h1 id="title" class="text-xl font-extrabold"></h1><p class="text-xs text-slate-500">لوحة التحكم المالية</p></div>
    <div class="flex items-center gap-2">
      <label class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2.5 rounded-xl text-sm font-bold cursor-pointer">+ رفع كشف حساب (CSV)<input id="file" type="file" accept=".csv" class="hidden" onchange="upload(this)"></label>
      <button onclick="signOut()" class="text-xs text-slate-500 underline">خروج</button>
    </div>
  </header>
  <div class="p-4 md:p-8 space-y-6 max-w-6xl mx-auto">
    <p id="msg" class="text-sm font-bold"></p>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div class="bg-white p-5 rounded-2xl border border-slate-200"><p class="text-sm font-bold text-slate-500">النقدية المتاحة</p><h3 id="kCash" class="text-2xl font-extrabold">-</h3></div>
      <div class="bg-white p-5 rounded-2xl border border-slate-200"><p class="text-sm font-bold text-slate-500">العمر النقدي (Runway)</p><h3 id="kRun" class="text-2xl font-extrabold">-</h3></div>
      <div class="bg-white p-5 rounded-2xl border border-slate-200"><p class="text-sm font-bold text-slate-500">معدل الحرق الشهري</p><h3 id="kBurn" class="text-2xl font-extrabold">-</h3></div>
    </div>
    <div class="bg-white p-5 rounded-2xl border border-slate-200"><h2 class="font-bold mb-3">تطور الرصيد النقدي</h2><div class="h-64"><canvas id="chart"></canvas></div></div>
    <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden">
      <h2 class="font-bold p-5 border-b border-slate-200">أحدث الحركات</h2>
      <div class="overflow-x-auto"><table class="w-full text-right text-sm"><thead class="bg-slate-50 text-slate-500 text-xs"><tr><th class="p-3">التاريخ</th><th class="p-3">البيان</th><th class="p-3">التصنيف</th><th class="p-3">المبلغ</th></tr></thead><tbody id="rows" class="divide-y divide-slate-100"></tbody></table></div>
    </div>
  </div>
</div>

<script>
const SB_URL = 'https://oorsnupcxmdqimuancsz.supabase.co';
const SB_KEY = 'sb_publishable_nvrHdiBa-OmGnPHAXk0L1w_ZjkA8d5f';
const sb = supabase.createClient(SB_URL, SB_KEY);
const AR = {'Sales Revenue':'مبيعات وإيرادات','Cost of Goods Sold':'تكلفة البضاعة (COGS)','Operating Expenses':'مصاريف تشغيلية','Salaries & Wages':'رواتب وأجور','Marketing':'تسويق','Taxes & Fees':'ضرائب ورسوم','Other':'أخرى','Uncategorized':'غير مصنف'};
const $ = id => document.getElementById(id);
const fmt = n => Number(n).toLocaleString('en-US', {maximumFractionDigits: 0});
let companyId = null, chart = null;

function show(id){ ['auth','setup','app'].forEach(x => $(x).classList.toggle('hidden', x !== id)); }

async function signIn(){
  const {error} = await sb.auth.signInWithPassword({email: $('email').value.trim(), password: $('pass').value});
  if (error) $('authMsg').textContent = 'تعذّر الدخول: ' + error.message; else boot();
}
async function signUp(){
  const {data, error} = await sb.auth.signUp({email: $('email').value.trim(), password: $('pass').value});
  if (error) { $('authMsg').textContent = error.message; return; }
  if (data.session) boot(); else { $('authMsg').className = 'text-xs text-emerald-600'; $('authMsg').textContent = 'تم. افتح الرابط اللي وصلك على الإيميل، وبعدها اضغط دخول.'; }
}
async function signOut(){ await sb.auth.signOut(); show('auth'); }

async function boot(){
  const {data:{session}} = await sb.auth.getSession();
  if (!session) return show('auth');
  const {data} = await sb.from('company_members').select('company_id').limit(1);
  if (!data || !data.length) return show('setup');
  companyId = data[0].company_id;
  show('app');
  load();
}
async function createCompany(){
  const name = $('cName').value.trim(), cash = Number($('cCash').value || 0);
  if (!name) { $('setupMsg').textContent = 'اكتب اسم الشركة'; return; }
  const {error} = await sb.rpc('create_company', {p_name: name, p_opening_cash: cash});
  if (error) $('setupMsg').textContent = error.message; else boot();
}

async function load(){
  const {data: co} = await sb.from('companies').select('name').eq('id', companyId).single();
  $('title').textContent = 'نظرة عامة على السيولة - ' + (co ? co.name : '');
  const {data: m} = await sb.from('company_metrics').select('*').eq('company_id', companyId).single();
  const {data: tx} = await sb.from('transactions').select('tx_date,description,category,amount').eq('company_id', companyId).order('tx_date', {ascending: true}).limit(5000);
  const cash = Number(m.cash_on_hand), burn = Number(m.burn_rate);
  $('kCash').textContent = fmt(cash) + ' ج.م';
  $('kBurn').textContent = fmt(burn) + ' ج.م';
  $('kRun').textContent = m.runway_months === null ? 'لا يوجد حرق' : m.runway_months + ' شهر';
  const monthly = {};
  (tx || []).forEach(t => { const k = t.tx_date.slice(0,7); monthly[k] = (monthly[k] || 0) + Number(t.amount); });
  let run = Number(m.opening_cash);
  const keys = Object.keys(monthly).sort(), vals = keys.map(k => (run += monthly[k]));
  if (chart) chart.destroy();
  chart = new Chart($('chart'), {type:'line', data:{labels: keys, datasets:[{data: vals, borderColor:'#4f46e5', backgroundColor:'rgba(79,70,229,.08)', borderWidth:3, fill:true, tension:.35}]},
    options:{responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{x:{grid:{display:false}}}}});
  const body = $('rows'); body.textContent = '';
  (tx || []).slice(-10).reverse().forEach(t => {
    const tr = document.createElement('tr');
    const a = Number(t.amount);
    [t.tx_date, t.description, AR[t.category] || t.category, (a > 0 ? '+' : '') + a.toLocaleString('en-US', {minimumFractionDigits: 2}) + ' ج.م'].forEach((v, i) => {
      const td = document.createElement('td'); td.className = 'p-3' + (i === 3 ? (a > 0 ? ' font-bold text-emerald-600' : ' font-bold text-rose-600') : '');
      td.textContent = v; tr.appendChild(td);
    });
    body.appendChild(tr);
  });
}

async function upload(inp){
  const f = inp.files[0]; if (!f) return;
  const msg = $('msg'); msg.className = 'text-sm font-bold text-slate-500'; msg.textContent = 'جاري المعالجة...';
  const {data:{session}} = await sb.auth.getSession();
  const fd = new FormData(); fd.append('company_id', companyId); fd.append('file', f);
  try {
    const r = await fetch(SB_URL + '/functions/v1/analyze-csv', {method:'POST', headers:{Authorization:'Bearer ' + session.access_token, apikey: SB_KEY}, body: fd});
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || j.message || 'خطأ');
    msg.className = 'text-sm font-bold text-emerald-600';
    msg.textContent = 'تم رفع ' + j.inserted + ' حركة' + (j.skipped ? ' (تجاهلت ' + j.skipped + ' صف غير صالح)' : '');
    load();
  } catch (e) { msg.className = 'text-sm font-bold text-rose-600'; msg.textContent = 'فشل الرفع: ' + e.message; }
  inp.value = '';
}
boot();
</script>
</body>
</html>
