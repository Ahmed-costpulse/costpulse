<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تدفق</title>
<style>
  :root{--bg:#f4f6f9;--card:#fff;--text:#1c2733;--muted:#6b7785;--brand:#0b6e4f;--danger:#c62828;--warn:#ef6c00;--info:#1565c0}
  @media (prefers-color-scheme:dark){:root{--bg:#10161c;--card:#1a232c;--text:#e8eef3;--muted:#98a6b3}}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--text)}
  header{background:var(--brand);color:#fff;padding:16px;font-size:20px;font-weight:700}
  main{padding:12px;max-width:720px;margin:auto}
  .banner{padding:10px 12px;border-radius:10px;margin-bottom:12px;font-size:14px}
  .banner.demo{background:#fff3cd;color:#664d03}
  .banner.live{background:#d1e7dd;color:#0f5132}
  .banner.err{background:#f8d7da;color:#842029}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .kpi{background:var(--card);border-radius:12px;padding:12px;box-shadow:0 1px 4px #0002}
  .kpi small{color:var(--muted)}
  .kpi b{display:block;font-size:20px;margin-top:4px}
  h2{font-size:17px;margin:20px 0 8px}
  .tip{background:var(--card);border-radius:12px;padding:12px;margin:10px 0;box-shadow:0 1px 4px #0002;border-right:5px solid var(--info);line-height:1.7}
  .tip.danger{border-color:var(--danger)}.tip.warn{border-color:var(--warn)}
  .note{color:var(--muted);font-size:12px;margin-top:8px}
</style>
</head>
<body>
<header>تدفق</header>
<main>
  <div id="status" class="banner demo">جاري التحميل…</div>
  <div class="grid">
    <div class="kpi"><small>السيولة الحالية</small><b id="k-cash">—</b></div>
    <div class="kpi"><small>إيرادات آخر 30 يوم</small><b id="k-inc">—</b></div>
    <div class="kpi"><small>مصروفات آخر 30 يوم</small><b id="k-exp">—</b></div>
    <div class="kpi"><small>هامش الربح</small><b id="k-margin">—</b></div>
  </div>
  <h2>أهم نصائح الأرباح والسيولة</h2>
  <div id="tips"></div>
  <div class="note">توصيات استرشادية مبنية على بياناتك، وليست قراراً نهائياً.</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// ====== 1) الإعدادات: حط بيانات Supabase بتاعتك هنا ======
const SUPABASE_URL = 'ضع_رابط_المشروع_هنا';   // مثال: https://abcd1234.supabase.co
const SUPABASE_KEY = 'ضع_anon_key_هنا';        // المفتاح العام anon فقط، ليس service_role

// ====== 2) أسماء الجداول والأعمدة: عدّلها لو عندك أسماء مختلفة ======
const S = {
  receivables:  {table:'receivables',   amount:'amount', issued:'issue_date', due:'due_date', paid:'paid_date', party:'customer'},
  payables:     {table:'payables',      amount:'amount', due:'due_date', paid:'paid_date', party:'supplier'},
  transactions: {table:'transactions',  amount:'amount', date:'date', type:'type', category:'category'}, // type: income | expense
  inventory:    {table:'inventory',     qty:'qty', cost:'unit_cost', lastMove:'last_movement_date'},
  cash:         {table:'cash_accounts', balance:'balance'}
};

// ====== أدوات ======
const DAY = 864e5;
const $ = id => document.getElementById(id);
const d = v => v ? new Date(v) : null;
const sum = (a, f) => a.reduce((s, x) => s + (Number(f(x)) || 0), 0);
const fmt = n => Math.round(n).toLocaleString('ar-EG');
const ago = n => new Date(Date.now() - n * DAY).toISOString().slice(0, 10);
const ahead = n => new Date(Date.now() + n * DAY).toISOString().slice(0, 10);

// ====== بيانات تجريبية (تظهر لو Supabase لسه مش متضبط) ======
function demoData() {
  return {
    recv: [
      {customer:'عميل أ', amount:80000, issue_date:ago(70), due_date:ago(30), paid_date:null},
      {customer:'عميل ب', amount:45000, issue_date:ago(50), due_date:ago(10), paid_date:null},
      {customer:'عميل ج', amount:30000, issue_date:ago(40), due_date:ahead(10), paid_date:null},
      {customer:'عميل د', amount:20000, issue_date:ago(80), due_date:ago(40), paid_date:ago(20)}
    ],
    pay: [
      {supplier:'مورد 1', amount:90000, due_date:ahead(12), paid_date:null},
      {supplier:'ضرائب', amount:35000, due_date:ahead(20), paid_date:null}
    ],
    tx: [
      ...[5,12,20,27].map(n => ({date:ago(n), type:'income', amount:55000, category:'مبيعات'})),
      ...[8,15,25].map(n => ({date:ago(n), type:'expense', amount:38000, category:'خامات'})),
      {date:ago(10), type:'expense', amount:25000, category:'رواتب'},
      ...[35,45,55].map(n => ({date:ago(n), type:'income', amount:70000, category:'مبيعات'})),
      ...[38,48,58].map(n => ({date:ago(n), type:'expense', amount:36000, category:'خامات'}))
    ],
    inv: [
      {qty:100, unit_cost:200, last_movement_date:ago(120)},
      {qty:40, unit_cost:150, last_movement_date:ago(10)}
    ],
    cash: [{balance:60000}]
  };
}

// ====== جلب البيانات ======
async function loadData() {
  if (!SUPABASE_URL.startsWith('http')) return {data: demoData(), mode: 'demo'};
  try {
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const get = async t => { const {data, error} = await sb.from(t).select('*'); if (error) throw error; return data || []; };
    const [recv, pay, tx, inv, cash] = await Promise.all(
      [S.receivables.table, S.payables.table, S.transactions.table, S.inventory.table, S.cash.table].map(get));
    return {data: {recv, pay, tx, inv, cash}, mode: 'live'};
  } catch (e) {
    return {data: demoData(), mode: 'err', msg: e.message};
  }
}

// ====== حساب المؤشرات ======
function compute({recv, pay, tx, inv, cash}) {
  const now = new Date(), t30 = new Date(now - 30*DAY), t60 = new Date(now - 60*DAY), t90 = new Date(now - 90*DAY);
  const T = S.transactions, amt = r => Number(r[T.amount]) || 0, isT = (r, ty) => r[T.type] === ty;
  const inR = (r, a, b) => { const t = d(r[T.date]); return t >= a && t < b; };
  const cur = tx.filter(r => inR(r, t30, now)), prev = tx.filter(r => inR(r, t60, t30));
  const inc = sum(cur.filter(r => isT(r, 'income')), amt), exp = sum(cur.filter(r => isT(r, 'expense')), amt);
  const incP = sum(prev.filter(r => isT(r, 'income')), amt), expP = sum(prev.filter(r => isT(r, 'expense')), amt);
  const cashNow = sum(cash, r => r[S.cash.balance]);

  const R = S.receivables, P = S.payables, I = S.inventory;
  const unpaid = recv.filter(r => !r[R.paid]);
  const overdue = unpaid.filter(r => d(r[R.due]) < now).sort((a, b) => b[R.amount] - a[R.amount]);
  const overdueTotal = sum(overdue, r => r[R.amount]);
  const paidR = recv.filter(r => r[R.paid] && d(r[R.paid]) >= t90 && r[R.issued]);
  const dso = paidR.length ? paidR.reduce((s, r) => s + (d(r[R.paid]) - d(r[R.issued])) / DAY, 0) / paidR.length : null;
  const in30 = new Date(+now + 30*DAY);
  const due30 = sum(pay.filter(r => !r[P.paid] && d(r[P.due]) <= in30), r => r[P.amount]);
  const collect30 = sum(unpaid.filter(r => d(r[R.due]) <= in30), r => r[R.amount]);

  const byCat = {};
  cur.filter(r => isT(r, 'expense')).forEach(r => { const c = r[T.category] || 'أخرى'; byCat[c] = (byCat[c] || 0) + amt(r); });
  const topCats = Object.entries(byCat).sort((a, b) => b[1] - a[1]);
  const stale = inv.filter(r => d(r[I.lastMove]) < t90);
  const staleValue = sum(stale, r => r[I.qty] * r[I.cost]);

  return {cashNow, inc, exp, margin: inc ? (inc-exp)/inc : 0, marginPrev: incP ? (incP-expP)/incP : 0,
    coverage: exp ? cashNow/exp : null, overdue, overdueTotal, dso, due30, collect30, topCats, stale, staleValue};
}

// ====== بناء النصائح ======
function buildTips(m) {
  const tips = [];
  const add = (p, level, title, why, impact, action) => tips.push({p, level, title, why, impact, action});
  if (m.cashNow + m.collect30 < m.due30)
    add(100,'danger','فجوة سيولة قادمة',`التزامات 30 يوم (${fmt(m.due30)}) أكبر من النقدية + المتوقع تحصيله (${fmt(m.cashNow+m.collect30)})`,`العجز المتوقع ${fmt(m.due30-m.cashNow-m.collect30)}`,'اطلب تحصيلاً مبكراً من أكبر العملاء، وفاوض الموردين على تأجيل جزء من السداد.');
  if (m.coverage !== null && m.coverage < 2)
    add(90,'danger','السيولة تغطي أقل من شهرين',`النقدية تكفي ${m.coverage.toFixed(1)} شهر من المصروفات`,'خطر توقف التشغيل عند أي تأخير في التحصيل','أجّل المشتريات غير الضرورية وابنِ احتياطياً لا يقل عن شهرين.');
  if (m.overdueTotal > 0)
    add(80,'warn','مديونيات متأخرة عند العملاء',`${m.overdue.length} فاتورة متأخرة بإجمالي ${fmt(m.overdueTotal)}`,`تحصيلها يرفع السيولة بـ ${fmt(m.overdueTotal)}`,`ابدأ بأكبر المديونيات: ${m.overdue.slice(0,3).map(r => r[S.receivables.party]).join('، ')}.`);
  if (m.marginPrev && m.margin < m.marginPrev - 0.02)
    add(75,'warn','هامش الربح نزل',`من ${(m.marginPrev*100).toFixed(1)}% إلى ${(m.margin*100).toFixed(1)}%`,`فرق تقريبي ${fmt((m.marginPrev-m.margin)*m.inc)} في الشهر`,'راجع هل السبب زيادة تكلفة أم نزول أسعار البيع، وعدّل التسعير أو غيّر المورد.');
  if (m.dso !== null && m.dso > 45)
    add(70,'warn','التحصيل بطيء',`متوسط التحصيل ${Math.round(m.dso)} يوم`,'كل يوم تأخير يعني نقدية محبوسة','جرّب خصم سداد مبكر أو اشترط دفعة مقدمة.');
  if (m.staleValue > 0)
    add(65,'warn','مخزون راكد',`${m.stale.length} صنف لم يتحرك 90 يوم، قيمته ${fmt(m.staleValue)}`,'رأس مال واقف يمكن تحويله لسيولة','اعمل عرض تخفيض أو باقات، وأوقف إعادة شرائه.');
  if (m.topCats.length) {
    const [c, v] = m.topCats[0];
    add(60,'info','أكبر بند مصروفات',`"${c}" = ${fmt(v)} (${m.exp ? Math.round(v/m.exp*100) : 0}% من المصروفات)`,`توفير 5% فيه = ${fmt(v*0.05)} شهرياً`,'قارن موردين بديلين أو تفاوض على عقد سنوي.');
  }
  if (m.coverage !== null && m.coverage > 6)
    add(40,'info','سيولة زيادة عن الحاجة',`النقدية تغطي ${m.coverage.toFixed(1)} شهر`,'فرصة ضائعة لو بقيت راكدة','فكّر في سداد التزام مكلف أو وديعة أو توسع مدروس.');
  return tips.sort((a, b) => b.p - a.p);
}

// ====== العرض ======
function render(m, tips, mode, msg) {
  const st = $('status');
  if (mode === 'live') { st.className = 'banner live'; st.textContent = 'متصل ببياناتك ✅'; }
  else if (mode === 'err') { st.className = 'banner err'; st.textContent = 'تعذر الاتصال بـ Supabase: ' + msg + ' (يعرض بيانات تجريبية)'; }
  else { st.className = 'banner demo'; st.textContent = 'وضع تجريبي: ضع بيانات Supabase في أول السكريبت لعرض بياناتك'; }
  $('k-cash').textContent = fmt(m.cashNow);
  $('k-inc').textContent = fmt(m.inc);
  $('k-exp').textContent = fmt(m.exp);
  $('k-margin').textContent = (m.margin * 100).toFixed(1) + '%';
  $('tips').innerHTML = tips.length ? tips.slice(0, 3).map(t =>
    `<div class="tip ${t.level}"><b>${t.title}</b><br>📊 ${t.why}<br>💰 ${t.impact}<br>✅ ${t.action}</div>`).join('')
    : '<div class="tip">الوضع المالي مستقر، لا توجد تنبيهات حالياً 👌</div>';
}

(async () => {
  const {data, mode, msg} = await loadData();
  const m = compute(data);
  render(m, buildTips(m), mode, msg);
})();
</script>
</body>
</html>
